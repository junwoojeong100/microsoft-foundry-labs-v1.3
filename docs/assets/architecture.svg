<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="420" viewBox="0 0 1180 420" role="img" aria-labelledby="title desc">
  <title id="title">출장 도우미의 구조</title>
  <desc id="desc">로컬 앱이 Foundry 에이전트에 질문합니다. 에이전트는 Foundry의 모델과 파일 검색을 쓰며, 계산 함수는 로컬 앱이 실행합니다. 실제 응답은 평가와 추적으로 개선합니다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1180" height="420" rx="18" fill="#f8fafc"/>
  <g font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#0f172a">
    <rect x="25" y="35" width="320" height="270" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="50" y="68" font-size="20" font-weight="bold">내 컴퓨터</text>
    <rect x="55" y="92" width="260" height="72" rx="12" fill="white"/>
    <text x="185" y="123" text-anchor="middle" font-size="21" font-weight="bold">출장 도우미 앱</text>
    <text x="185" y="149" text-anchor="middle" font-size="16">질문 · 답변 · 근거 표시</text>
    <rect x="55" y="198" width="260" height="74" rx="12" fill="white"/>
    <text x="185" y="229" text-anchor="middle" font-size="21" font-weight="bold">읽기 전용 계산 함수</text>
    <text x="185" y="254" text-anchor="middle" font-size="16">입력 검증 → 정해진 수식</text>
    <rect x="435" y="35" width="720" height="270" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="460" y="68" font-size="20" font-weight="bold">Microsoft Foundry</text>
    <rect x="465" y="101" width="255" height="150" rx="12" fill="white"/>
    <text x="593" y="135" text-anchor="middle" font-size="22" font-weight="bold">에이전트 + 모델</text>
    <text x="593" y="171" text-anchor="middle" font-size="17">지침과 버전 관리</text>
    <text x="593" y="198" text-anchor="middle" font-size="17">검색 / 도구 호출 요청</text>
    <text x="593" y="225" text-anchor="middle" font-size="17">근거를 사용해 답변</text>
    <rect x="845" y="101" width="275" height="150" rx="12" fill="white"/>
    <text x="983" y="135" text-anchor="middle" font-size="22" font-weight="bold">File Search</text>
    <text x="983" y="171" text-anchor="middle" font-size="17">가상 규정 3개</text>
    <text x="983" y="198" text-anchor="middle" font-size="17">관련 부분 검색</text>
    <text x="983" y="225" text-anchor="middle" font-size="17">원문 인용</text>
    <path d="M315 125 H460" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="385" y="110" text-anchor="middle" font-size="15">질문</text>
    <path d="M465 235 H320" fill="none" stroke="#475569" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="389" y="220" text-anchor="middle" font-size="15">호출 ↔ 결과</text>
    <path d="M720 176 H840" fill="none" stroke="#475569" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <rect x="235" y="340" width="715" height="54" rx="12" fill="#0f172a"/>
    <text x="593" y="375" text-anchor="middle" font-size="20" fill="white">실제 응답 → 평가 · 추적 → 사람의 검토 → 지침 개선</text>
    <path d="M593 251 V335" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
</svg>
