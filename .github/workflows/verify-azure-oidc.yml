name: Verify Azure OIDC authentication

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: foundry-workshop-oidc-verification
  cancel-in-progress: false

jobs:
  authenticate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: foundry-workshop
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Require the configured identity
        run: python3 scripts/verify_ci_auth.py --preflight
      - name: Authenticate with the repository-bound OIDC identity
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Verify the identity without deploying or invoking a model
        run: python3 scripts/verify_ci_auth.py
