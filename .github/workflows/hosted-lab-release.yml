name: Approved hosted lab release

on:
  workflow_dispatch:
    inputs:
      language:
        description: Language of the synthetic dev bundle
        type: choice
        options: [en, ko]
        default: ko
        required: true
      acknowledge_cost:
        description: Approve training deployment, scoped runtime role and six-case billable dev gate
        type: boolean
        default: false
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: owned-foundry-lab-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: foundry-workshop
    env:
      WORKSHOP_LANGUAGE: ${{ inputs.language }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_AI_ACCOUNT_NAME: ${{ vars.AZURE_AI_ACCOUNT_NAME }}
      AZURE_AI_PROJECT_ENDPOINT: ${{ vars.AZURE_AI_PROJECT_ENDPOINT }}
      AZURE_AI_PROJECT_ID: ${{ vars.AZURE_AI_PROJECT_ID }}
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${{ vars.AZURE_AI_MODEL_DEPLOYMENT_NAME }}
      WORKSHOP_PREFIX: ${{ vars.WORKSHOP_PREFIX }}
      WORKSHOP_HOSTED_AGENT_NAME: ${{ vars.WORKSHOP_HOSTED_AGENT_NAME }}
      WORKSHOP_AUTH_MODE: cli
    steps:
      - uses: actions/checkout@v4
      - name: Require explicit execution approval
        env:
          ACKNOWLEDGE_COST: ${{ inputs.acknowledge_cost }}
        run: |
          if [ "$ACKNOWLEDGE_COST" != "true" ]; then
            echo "::error::This workflow requires explicit training deployment and cost approval."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: Azure/setup-azd@v2
        with:
          version: "1.34.0"
      - name: Prepare verified tools
        run: |
          python -m pip install --quiet -r requirements.lock.txt -e ".[cloud,agents,hosted,dev]"
          python -m pip check
          python scripts/check_sdk.py
          azd ext install microsoft.foundry
          azd version
          azd ext list
      - name: Authenticate with the repository-bound OIDC identity
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Check and package the exact runtime
        run: |
          python scripts/workshop.py --language "$WORKSHOP_LANGUAGE" doctor --cloud
          python scripts/prepare_ci_azd.py --agent-name "$WORKSHOP_HOSTED_AGENT_NAME" --validate-only
          python scripts/package_hosted.py --language "$WORKSHOP_LANGUAGE" --kind workflow --pattern sequential --retrieval local --prompt v2 --protocol invocations
          python -c 'import json,os; print("WORKSHOP_MODEL_DEPLOYMENTS_JSON="+json.dumps({"primary":os.environ["AZURE_AI_MODEL_DEPLOYMENT_NAME"]}))' >> "$GITHUB_ENV"
      - name: Initialize only the existing-project code deployment
        run: |
          azd config set auth.useAzCliAuth true
          AZD_PROJECT_DIR="$RUNNER_TEMP/foundry-workshop-release"
          printf 'AZD_PROJECT_DIR=%s\n' "$AZD_PROJECT_DIR" >> "$GITHUB_ENV"
          PACKAGE=".build/workflow-sequential-local-v2-project-responses-invocations"
          if [ "$WORKSHOP_LANGUAGE" = "en" ]; then PACKAGE="${PACKAGE}-en"; fi
          PROJECT_LOCATION=$(az cognitiveservices account show --subscription "$AZURE_SUBSCRIPTION_ID" --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_AI_ACCOUNT_NAME" --query location --output tsv)
          python scripts/prepare_hosted_azd.py --language "$WORKSHOP_LANGUAGE" --kind workflow --package "$PACKAGE" --directory "$AZD_PROJECT_DIR" --agent-name "$WORKSHOP_HOSTED_AGENT_NAME" --initialize-env --project-id "$AZURE_AI_PROJECT_ID" --location "$PROJECT_LOCATION"
      - name: Deploy only the approved service
        run: |
          cd "$AZD_PROJECT_DIR"
          azd deploy "$WORKSHOP_HOSTED_AGENT_NAME" --no-prompt
          python "$GITHUB_WORKSPACE/scripts/export_hosted_binding.py" --service "$WORKSHOP_HOSTED_AGENT_NAME" --output "$GITHUB_WORKSPACE/outputs/ci-binding.json" --github-env "$GITHUB_ENV"
      - name: Give only the owned runtime project access
        run: |
          cd "$AZD_PROJECT_DIR"
          python "$GITHUB_WORKSPACE/scripts/grant_ci_runtime_role.py" --service "$WORKSHOP_HOSTED_AGENT_NAME" --output "$GITHUB_WORKSPACE/outputs/ci-runtime-role.json" --confirm-role
          sleep 60
      - name: Version-pinned six-case dev gate
        run: |
          python scripts/workshop.py --language "$WORKSHOP_LANGUAGE" benchmark collect --label ci-dev --kind workflow --pattern sequential --retrieval local --prompt v2 --api project-responses --concurrency 1 --confirm-cost
          python scripts/workshop.py --language "$WORKSHOP_LANGUAGE" benchmark report --label ci-dev
      - name: Stop only the session created by this matrix
        if: always()
        run: |
          if [ -f outputs/benchmarks/ci-dev/manifest.json ]; then
            python scripts/workshop.py --language "$WORKSHOP_LANGUAGE" benchmark stop-session --label ci-dev
          fi
      - name: Retain all outputs including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundry-lab-${{ inputs.language }}-${{ github.run_id }}
          path: outputs/
          if-no-files-found: warn
          retention-days: 14
