name: Workshop checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --quiet -r requirements.txt
      - run: python -m pip check
      - run: python scripts/check_workshop.py
      - run: python -m unittest discover -s tests -t . -q
      - run: python -m unittest discover -s tests_sdk -t . -q
        env:
          OTEL_SDK_DISABLED: "true"
      - run: ruff check .
      - run: python -m compileall -q src scripts examples tests tests_sdk
      - run: python scripts/package_workshop.py
